# VirtualGL High Performance Profile
VGL_COMPRESS=proxy
VGL_READBACK=sync
VGL_SYNC=1
VGL_GAMMA=1
VGL_LOGO=0
VGL_SUBSAMP=444  # No subsampling - best quality
VGL_QUAL=95      # High JPEG quality
VGL_SPOIL=0      # No frame spoiling - all frames rendered
VGL_FPS=60       # Target 60 FPS
VGL_TRANSPORT=vgl
