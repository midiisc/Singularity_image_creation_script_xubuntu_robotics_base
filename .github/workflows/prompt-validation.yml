name: Prompt Validation Checks

on:
  pull_request:
    branches: [main, beta]
    paths:
      - '**.sh'
      - 'xubuntu_robotics_base_post_ULTRA_CLEANED.sh'
      - 'build_xubuntu_robotics_base.sh'
      - 'prompts/**'
      - 'scripts/**'
  push:
    branches: [main, beta]
    paths:
      - '**.sh'
      - 'xubuntu_robotics_base_post_ULTRA_CLEANED.sh'
      - 'build_xubuntu_robotics_base.sh'
      - 'prompts/**'
      - 'scripts/**'

jobs:
  check-pipe-patterns:
    name: Check Unsafe Pipe Patterns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for echo | grep patterns
        id: pipe_check
        env:
          GITHUB_ACTIONS: true
        run: |
          echo "Checking for unsafe 'echo | grep' patterns..."
          
          FOUND_ERRORS=false
          
          # Check each file and output detailed errors with GitHub Actions annotations
          for file in xubuntu_robotics_base_post_ULTRA_CLEANED.sh build_xubuntu_robotics_base.sh; do
            if [ ! -f "$file" ]; then
              continue
            fi
            
            # Find all echo | grep patterns with file:line:content format
            # Use here-string instead of echo | cut (D3: PIPE PATTERN SAFETY)
            while IFS= read -r line_info; do
              if [ -n "$line_info" ]; then
                FOUND_ERRORS=true
                line_num=""
                line_num=$(cut -d: -f1 <<< "$line_info" || echo "")
                line_content=""
                line_content=$(cut -d: -f2- <<< "$line_info" || echo "")
                
                # Output GitHub Actions error annotation with file:line details
                echo "::error file=$file,line=$line_num::Unsafe pipe pattern found: echo | grep should be replaced with here-string (grep <<< \"\${var}\")"
                echo "   $file:$line_num: $line_content"
              fi
            done < <(grep -n 'echo.*|.*grep' "$file" 2>/dev/null || true)
          done
          
          if [ "$FOUND_ERRORS" = true ]; then
            echo "❌ Found unsafe pipe patterns"
            echo ""
            echo "**Fix:** Replace 'echo \"\${VAR}\" | grep' with 'grep <<< \"\${VAR}\"'"
            exit 1
          else
            echo "✅ No unsafe pipe patterns found"
          fi

  validate-cmake-flags:
    name: Validate CMake Flags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make validator executable
        run: chmod +x scripts/helpers/validate_cmake_flags.sh

      - name: Run CMake flag validator
        env:
          GITHUB_ACTIONS: true
        run: |
          echo "Validating CMake flags..."
          if ./scripts/helpers/validate_cmake_flags.sh xubuntu_robotics_base_post_ULTRA_CLEANED.sh --strict; then
            echo "✅ CMake flags validation passed"
          else
            echo "❌ CMake flags validation failed"
            echo ""
            echo "**Fix:** Review errors above. Each error shows file:line:flag details."
            echo "Check docs/flags/ for library flag documentation."
            exit 1
          fi

  check-multi-phase-docs:
    name: Check Multi-Phase Logic Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for undocumented multi-phase logic
        run: |
          echo "Checking for complex logic blocks without phase markers..."
          
          # Count blocks with multiple related conditionals
          COMPLEX_BLOCKS=$(grep -c "for candidate in" xubuntu_robotics_base_post_ULTRA_CLEANED.sh || true)
          
          # Count phase markers
          PHASE_MARKERS=$(grep -c "# Phase [0-9]:" xubuntu_robotics_base_post_ULTRA_CLEANED.sh || true)
          
          echo "Found $COMPLEX_BLOCKS potential multi-phase blocks"
          echo "Found $PHASE_MARKERS phase markers"
          
          if [ "$COMPLEX_BLOCKS" -gt 0 ] && [ "$PHASE_MARKERS" -eq 0 ]; then
            echo "::warning::Consider adding phase markers to complex detection logic"
          else
            echo "✅ Multi-phase logic appears documented"
          fi

  check-tbb-verification:
    name: Check TBB Verification Blocks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify TBB checks exist
        env:
          GITHUB_ACTIONS: true
        run: |
          echo "Checking for TBB verification blocks..."
          
          MISSING_VERIFICATIONS=()
          
          # Check for TBB verification in Ceres
          if ! grep -q "Verifying TBB configuration for Ceres" xubuntu_robotics_base_post_ULTRA_CLEANED.sh; then
            MISSING_VERIFICATIONS+=("Ceres")
            # Find where Ceres is configured to suggest where to add verification
            # D3: PIPE PATTERN SAFETY - Use single grep with combined pattern instead of pipe chain
            CERES_LINE="unknown"
            ceres_match=""
            # Combine patterns to avoid pipe chain: search for lines with both CERES/Ceres AND cmake/build/install
            ceres_match=$(grep -nE "(CERES|Ceres).*(cmake|build|install)|(cmake|build|install).*(CERES|Ceres)" xubuntu_robotics_base_post_ULTRA_CLEANED.sh | head -1 || echo "")
            if [ -n "${ceres_match}" ]; then
              CERES_LINE=""
              CERES_LINE=$(cut -d: -f1 <<< "${ceres_match}" || echo "unknown")
            fi
            if [ -n "${CERES_LINE}" ] && [ "${CERES_LINE}" != "unknown" ]; then
              echo "::error file=xubuntu_robotics_base_post_ULTRA_CLEANED.sh,line=$CERES_LINE::Missing TBB verification block for Ceres. Add verification after Ceres installation."
            else
              echo "::error file=xubuntu_robotics_base_post_ULTRA_CLEANED.sh::Missing TBB verification block for Ceres"
            fi
          fi
          
          # Check for TBB verification in g2o
          if ! grep -q "Verifying TBB configuration for g2o" xubuntu_robotics_base_post_ULTRA_CLEANED.sh; then
            MISSING_VERIFICATIONS+=("g2o")
            # D3: PIPE PATTERN SAFETY - Use single grep with combined pattern instead of pipe chain
            G2O_LINE="unknown"
            g2o_match=""
            # Combine patterns to avoid pipe chain: search for lines with both g2o/G2O AND cmake/build/install
            g2o_match=$(grep -nE "(g2o|G2O).*(cmake|build|install)|(cmake|build|install).*(g2o|G2O)" xubuntu_robotics_base_post_ULTRA_CLEANED.sh | head -1 || echo "")
            if [ -n "${g2o_match}" ]; then
              G2O_LINE=""
              G2O_LINE=$(cut -d: -f1 <<< "${g2o_match}" || echo "unknown")
            fi
            if [ -n "${G2O_LINE}" ] && [ "${G2O_LINE}" != "unknown" ]; then
              echo "::error file=xubuntu_robotics_base_post_ULTRA_CLEANED.sh,line=$G2O_LINE::Missing TBB verification block for g2o. Add verification after g2o installation."
            else
              echo "::error file=xubuntu_robotics_base_post_ULTRA_CLEANED.sh::Missing TBB verification block for g2o"
            fi
          fi
          
          # Check for TBB verification in GTSAM
          if ! grep -q "Verifying TBB configuration for GTSAM" xubuntu_robotics_base_post_ULTRA_CLEANED.sh; then
            MISSING_VERIFICATIONS+=("GTSAM")
            # D3: PIPE PATTERN SAFETY - Use single grep with combined pattern instead of pipe chain
            GTSAM_LINE="unknown"
            gtsam_match=""
            # Combine patterns to avoid pipe chain: search for lines with both GTSAM/gtsam AND cmake/build/install
            gtsam_match=$(grep -nE "(GTSAM|gtsam).*(cmake|build|install)|(cmake|build|install).*(GTSAM|gtsam)" xubuntu_robotics_base_post_ULTRA_CLEANED.sh | head -1 || echo "")
            if [ -n "${gtsam_match}" ]; then
              GTSAM_LINE=""
              GTSAM_LINE=$(cut -d: -f1 <<< "${gtsam_match}" || echo "unknown")
            fi
            if [ -n "${GTSAM_LINE}" ] && [ "${GTSAM_LINE}" != "unknown" ]; then
              echo "::error file=xubuntu_robotics_base_post_ULTRA_CLEANED.sh,line=$GTSAM_LINE::Missing TBB verification block for GTSAM. Add verification after GTSAM installation."
            else
              echo "::error file=xubuntu_robotics_base_post_ULTRA_CLEANED.sh::Missing TBB verification block for GTSAM"
            fi
          fi
          
          if [ ${#MISSING_VERIFICATIONS[@]} -gt 0 ]; then
            echo "❌ Missing TBB verification blocks for: ${MISSING_VERIFICATIONS[*]}"
            echo ""
            echo "**Fix:** Add TBB verification blocks after each library installation."
            echo "Example: Verifying TBB configuration for <Library>"
            exit 1
          else
            echo "✅ TBB verification blocks found for all HPC libraries"
          fi

  check-heredoc-syntax:
    name: Check Heredoc Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate heredoc delimiters
        env:
          GITHUB_ACTIONS: true
        run: |
          echo "Checking heredoc syntax..."
          
          FOUND_WARNINGS=false
          
          # Check each file for unquoted EOF delimiters
          for file in xubuntu_robotics_base_post_ULTRA_CLEANED.sh build_xubuntu_robotics_base.sh; do
            if [ ! -f "$file" ]; then
              continue
            fi
            
            # Find unquoted EOF delimiters with file:line:content format
            # D3: PIPE PATTERN SAFETY - Use single grep with negative lookahead pattern instead of pipe chain
            while IFS= read -r line_info || [ -n "${line_info}" ]; do
              if [ -n "${line_info}" ]; then
                FOUND_WARNINGS=true
                line_num=""
                line_num=$(cut -d: -f1 <<< "${line_info}" || echo "")
                line_content=""
                line_content=$(cut -d: -f2- <<< "${line_info}" || echo "")
                
                # Output GitHub Actions warning annotation with file:line details
                echo "::warning file=$file,line=$line_num::Potentially unquoted EOF delimiter found. Consider using <<'EOF' for literal heredocs to prevent variable expansion"
                echo "   $file:$line_num: $line_content"
              fi
            done < <(grep -nE '<<EOF' "$file" 2>/dev/null | grep -vE "(<<'EOF'|<<\"EOF\")" || true)
          done
          
          if [ "$FOUND_WARNINGS" = true ]; then
            echo ""
            echo "**Fix:** Replace '<<EOF' with '<<'EOF'' for literal heredocs"
          else
            echo "✅ Heredoc syntax appears correct"
          fi

  check-bash-compatibility:
    name: Check Bash Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Bash 4+ features
        env:
          GITHUB_ACTIONS: true
        run: |
          echo "Checking for Bash 4+ specific features..."
          
          FOUND_ERRORS=false
          
          # Check for uppercase conversion (\${var^^})
          for file in xubuntu_robotics_base_post_ULTRA_CLEANED.sh build_xubuntu_robotics_base.sh; do
            if [ ! -f "$file" ]; then
              continue
            fi
            
            # Use here-string instead of echo | cut (D3: PIPE PATTERN SAFETY)
            while IFS= read -r line_info; do
              if [ -n "$line_info" ]; then
                FOUND_ERRORS=true
                line_num=""
                line_num=$(cut -d: -f1 <<< "$line_info" || echo "")
                line_content=""
                line_content=$(cut -d: -f2- <<< "$line_info" || echo "")
                
                echo "::error file=$file,line=$line_num::Found uppercase conversion (\${var^^}) - not compatible with Bash 3. Use alternative method or add Bash version check"
                echo "   $file:$line_num: $line_content"
              fi
            done < <(grep -nE '\$\{[^}]+\^\^' "$file" 2>/dev/null || true)
          done
          
          # Check for lowercase conversion (\${var,,})
          for file in xubuntu_robotics_base_post_ULTRA_CLEANED.sh build_xubuntu_robotics_base.sh; do
            if [ ! -f "$file" ]; then
              continue
            fi
            
            # Use here-string instead of echo | cut (D3: PIPE PATTERN SAFETY)
            while IFS= read -r line_info; do
              if [ -n "$line_info" ]; then
                FOUND_ERRORS=true
                line_num=""
                line_num=$(cut -d: -f1 <<< "$line_info" || echo "")
                line_content=""
                line_content=$(cut -d: -f2- <<< "$line_info" || echo "")
                
                echo "::error file=$file,line=$line_num::Found lowercase conversion (\${var,,}) - not compatible with Bash 3. Use alternative method or add Bash version check"
                echo "   $file:$line_num: $line_content"
              fi
            done < <(grep -nE '\$\{[^}]+,,' "$file" 2>/dev/null || true)
          done
          
          if [ "$FOUND_ERRORS" = true ]; then
            echo ""
            echo "❌ Found Bash 4+ specific features"
            echo "**Fix:** Use Bash 3 compatible alternatives or add version checks"
            exit 1
          else
            echo "✅ No Bash 4+ specific features detected"
          fi

  shellcheck:
    name: ShellCheck Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: |
            container-scripts
            analysis
            .github/workflows
            **/*.yml
            **/*.yaml
          check_together: 'yes'

  ai-code-review:
    name: AI Code Review (Claude)
    runs-on: ubuntu-latest
    # CRITICAL: This job requires ANTHROPIC_API_KEY secret to be set in GitHub repository settings
    # To set: Repository Settings → Secrets and variables → Actions → New repository secret
    # Name: ANTHROPIC_API_KEY
    # Value: Your Anthropic API key (starts with sk-ant-api03-...)
    #
    # AI REVIEW USES AUTHORITATIVE MANUAL:
    # - Explicitly parses and uses prompts/Code_check_prompt_manual.txt as SINGLE SOURCE OF TRUTH
    # - Checks ALL checklist items A1-P5 sequentially (A1-A6, B1-B3, C1-C5, D1-D4, E1-E3, F1-F3, G1-G5, H1-H4, I1-I4, J1-J3, K1-K3, L1-L6, M1-M14, N1-N5, O1-O4, P1-P5)
    # - References checklist item IDs (A1, D3, M8, etc.) in all findings
    # - Manual is loaded and included in full in the AI prompt
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for proper diff comparison

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git for diff
        run: |
          git config --global --add safe.directory ${{ github.workspace }}
          # Fetch base branch for PR diffs
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} || true
          else
            git fetch origin beta:beta || git fetch origin main:main || true
          fi

      - name: Verify API Key Configuration
        run: |
          # Store secret in variable to avoid repeated context access (fixes linter warnings)
          API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          if [ -z "$API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set in repository settings"
            echo "To fix: Repository Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: ANTHROPIC_API_KEY"
            echo "Value: Your Anthropic API key (starts with sk-ant-api03-...)"
            exit 1
          else
            echo "✅ ANTHROPIC_API_KEY secret is configured"
            # Verify key format (should start with sk-ant-)
            # Use here-string instead of echo | cut (D3: PIPE PATTERN SAFETY)
            KEY_PREFIX=""
            KEY_PREFIX=$(cut -c1-7 <<< "$API_KEY" || echo "")
            if [ -z "$KEY_PREFIX" ] || [ "$KEY_PREFIX" != "sk-ant-" ]; then
              echo "::warning::API key format may be incorrect (expected to start with 'sk-ant-')"
            fi
          fi

      - name: Verify Code_check_prompt_manual.txt exists
        run: |
          if [ ! -f "prompts/Code_check_prompt_manual.txt" ]; then
            echo "::error::Code_check_prompt_manual.txt not found at prompts/Code_check_prompt_manual.txt"
            exit 1
          fi
          echo "✓ Found authoritative manual: prompts/Code_check_prompt_manual.txt"
          echo "  Manual will be parsed and used explicitly for all validation checks"
          echo "  Checklist coverage: A1-P5 (all items from Structure through Build Flag Analysis)"

      - name: Run AI Code Review
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_DEFAULT_BRANCH: "beta"
          AI_REVIEW_PROVIDER: "anthropic"
          AI_REVIEW_API_URL: "https://api.anthropic.com/v1/messages"
          AI_REVIEW_MODEL: "claude-sonnet-4"
          # Note: secrets.ANTHROPIC_API_KEY is valid - linter warning is false positive
          # GitHub Actions secrets are accessible via ${{ secrets.SECRET_NAME }} syntax
          AI_REVIEW_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REVIEW_TIMEOUT: "180"
          AI_REVIEW_MAX_LINES: "400"
          AI_REVIEW_MAX_TOKENS: "8192"
        run: |
          echo "Running AI code review with Claude..."
          echo "GitHub Actions: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref }}"
          echo "Base ref: ${{ github.base_ref }}"
          echo "Provider: $AI_REVIEW_PROVIDER"
          echo "Model: $AI_REVIEW_MODEL"
          echo "API URL: $AI_REVIEW_API_URL"
          echo ""
          echo "📋 AI Review Configuration:"
          echo "  - Authoritative Manual: prompts/Code_check_prompt_manual.txt (SINGLE SOURCE OF TRUTH)"
          echo "  - Checklist Coverage: A1-P5 (all items)"
          echo "    * A1-A6: Structure & Syntax"
          echo "    * B1-B3: Shell Options"
          echo "    * C1-C5: Variables & Defaults"
          echo "    * D1-D4: Quoting & Expansion Safety"
          echo "    * E1-E3: Here-docs & Here-strings"
          echo "    * F1-F3: Logic & Flow Control"
          echo "    * G1-G5: Functions & Modularization"
          echo "    * H1-H4: Error Handling & Observability"
          echo "    * I1-I4: Timeouts, Retries, & Robustness"
          echo "    * J1-J3: Edge Cases & Resiliency"
          echo "    * K1-K3: Security Posture"
          echo "    * L1-L6: Performance & Maintainability"
          echo "    * M1-M14: Environment & Dependencies"
          echo "    * N1-N5: Resource Management & Cleanup"
          echo "    * O1-O4: Testing, Validation & Graceful Degradation"
          echo "    * P1-P5: Build Flag Analysis & CMake Configuration"
          echo "  - Validation: Sequential check of all checklist items"
          echo "  - Findings: Include checklist item IDs (A1, D3, M8, etc.)"
          echo ""
          python3 scripts/hooks/ai_precommit_review.py || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 1 ]; then
              echo "::warning::AI review found issues. Review the output above for details."
              echo "This is a non-blocking check. Fix issues before merging."
              exit 0  # Don't fail the workflow, just warn
            else
              echo "::error::AI review failed with exit code $EXIT_CODE"
              echo "Check the logs above for detailed error messages."
              exit $EXIT_CODE
            fi
          }

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [check-pipe-patterns, validate-cmake-flags, check-multi-phase-docs, check-tbb-verification, check-heredoc-syntax, check-bash-compatibility, ai-code-review]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Prompt Validation Summary"
          echo ""
          echo "All prompt-based validation checks completed."
          echo ""
          echo "If any checks failed, review the errors above and:"
          echo "1. Fix unsafe pipe patterns (use here-strings)"
          echo "2. Validate CMake flags against library documentation"
          echo "3. Add phase markers to complex multi-phase logic"
          echo "4. Ensure TBB verification exists for HPC libraries"
          echo "5. Quote heredoc delimiters for literal content"
          echo "6. Avoid Bash 4+ features or add version checks"
          echo "7. Review AI code review findings (if any)"
